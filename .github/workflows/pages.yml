name: Pages (canlı uygulama)
# Uygulamayı GitHub Pages'te yayınlar: https://<kullanici>.github.io/se-primer/
# Veri toplama linki: .../se-primer/?veri=1
# Bir kerelik elle ayar: depo > Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site klasörünü hazırla (yalnız uygulama dosyaları)
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/src
          if [ -d model ]; then cp -r model _site/model; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
